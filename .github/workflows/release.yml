name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Stamp version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' \
            -e "s/MARKETING_VERSION = .*/MARKETING_VERSION = $VERSION;/" \
            MinimalVideoConverter.xcodeproj/project.pbxproj

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build
        run: |
          xcodebuild \
            -scheme MinimalVideoConverter \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package
        run: |
          APP_PATH="build/Build/Products/Release/MinimalVideoConverter.app"
          tar -czf MinimalVideoConverter.tar.gz -C "$(dirname "$APP_PATH")" MinimalVideoConverter.app
          echo "SHA256=$(shasum -a 256 MinimalVideoConverter.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Update cask
        run: |
          git clone "https://x-access-token:${{ secrets.TAP_GITHUB_TOKEN }}@github.com/dimw/homebrew-minimal-video-converter.git" tap
          sed -i '' \
            -e "s/version \".*\"/version \"$VERSION\"/" \
            -e "s/sha256 .*/sha256 \"$SHA256\"/" \
            tap/Casks/minimal-video-converter.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/minimal-video-converter.rb
          git commit -m "chore: update cask to v$VERSION"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: MinimalVideoConverter.tar.gz
          body: |
            **Install via Homebrew:**
            ```
            brew tap dimw/minimal-video-converter
            brew install --cask minimal-video-converter
            ```

            **Or download directly** and open `MinimalVideoConverter.app`.

            SHA256: `${{ env.SHA256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump and cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MinimalVideoConverter.xcodeproj/project.pbxproj
          git commit -m "chore: release $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
